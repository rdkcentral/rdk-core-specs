# Site-level configuration for the RDK8 Video specification site.
# Content lives in the sibling .md files; styling lives in assets/css.

title: RDK9 Core RDK Entertainment Platform
footer: "Copyright \xA9 2026 RDK Management, LLC"

brand:
  href: index.html
  logo: assets/img/RDK-logo.png
  alt: RDK

fonts: "https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap"

# Link order is load-bearing: later files intentionally override earlier ones.
stylesheets:
  - assets/css/tokens.css
  - assets/css/base.css
  - assets/css/layout.css
  - assets/css/components.css
  - assets/css/tables.css
  - assets/css/spec.css
  - assets/css/overrides.css
  - assets/css/site.css
  - assets/css/chatbox.css
  - assets/css/contact.css

asset_version: rdk9-20261016-1

# The Northbound entry is a dropdown only; the Firebolt Core API Specification
# is also reached from the home page cards.
nav:
  - key: home
    label: Home
    href: index.html
  - key: components
    label: Components Catalog
    href: component-catalog.html
  - key: northbound
    label: Northbound API Spec
    dropdown:
      - label: Firebolt Core API Specification
        href: firebolt-api-spec.html
      - label: Firebolt Intents Specification
        href: firebolt-intents.html
      - label: Firebolt Key Codes Specification
        href: firebolt-key-codes.html
      - label: Firebolt App Actions Specification
        href: firebolt-app-actions.html
      - label: Firebolt App Services Specification
        href: firebolt-app-services.html
      - label: Firebolt Crypto Specification
        href: firebolt-crypto.html
  - key: southbound
    label: Southbound API Spec
    href: southbound-api-spec.html
  - key: hardware
    label: Hardware Compatibility Spec
    href: hardware-compatibility-spec.html      

status_legend:
  - term: Draft
    definition: Work in progress in the working group and underdoing internal reviews
  - term: Approved
    definition: Approved by RTAB with date and release
  - term: Published
    definition: Adopted through the PSC for an annual release
